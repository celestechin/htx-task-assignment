server {
  listen 80;
  root /usr/share/nginx/html;

  # api calls go to the backend container ("backend" is its name in docker-compose)
  # creating a task can wait on gemini, so give it time
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # react handles its own routes, so paths like /tasks/new get index.html instead of a 404
  location / {
    try_files $uri /index.html;
  }
}
